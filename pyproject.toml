[project]
name = "financial_ai_agent"
version = "0.1.0"
description = "Provider-neutral financial AI agent platform for Frappe"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "openai>=1.99,<3", "pydantic>=2.7,<3"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev"

[tool.ruff]
line-length = 100

